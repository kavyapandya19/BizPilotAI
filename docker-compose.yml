version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: bizpilot-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret

  backend:
    build: 
      context: ./backend
    container_name: bizpilot-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://root:secret@mongodb:27017/bizpilot?authSource=admin
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: bizpilot-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  ml-service:
    build:
      context: ./ml-service
    container_name: bizpilot-ml-service
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongodb_data:
